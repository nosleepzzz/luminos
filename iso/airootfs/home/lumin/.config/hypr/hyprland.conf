# LuminOS Glass — VirtualBox-first Hyprland defaults
# Menu: click "LuminOS" on the top bar, or Alt+D
# Terminal: opens automatically; also Alt+Return
# Super/Win often does NOT reach VirtualBox guests — use Alt.

env = WLR_RENDERER_ALLOW_SOFTWARE,1
env = WLR_NO_HARDWARE_CURSORS,1
env = LIBGL_ALWAYS_SOFTWARE,1
env = AQ_NO_MODIFIERS,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

monitor=,preferred,auto,1

exec-once = waybar
exec-once = dunst
exec-once = swaybg -i /usr/share/backgrounds/luminos/lumin-wallpaper.jpg -m fill
exec-once = sh -c 'command -v /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 >/dev/null && /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &'
# Always open a terminal so the session is usable without Super/Alt capture issues
exec-once = foot

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = yes
        tap-to-click = yes
    }
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(e6b800ee) rgba(33ccffee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 4
    blur {
        enabled = false
    }
}

animations {
    enabled = no
}

dwindle {
    preserve_split = yes
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

# Primary: ALT (works in VirtualBox when Win/Super is swallowed by the host)
bind = ALT, Return, exec, foot
bind = ALT, D, exec, wofi --show drun
bind = ALT, Q, killactive,
bind = ALT, F, fullscreen,
bind = ALT, M, exit,
bind = ALT, V, togglefloating,
bind = ALT, left, movefocus, l
bind = ALT, right, movefocus, r
bind = ALT, up, movefocus, u
bind = ALT, down, movefocus, d
bind = ALT, 1, workspace, 1
bind = ALT, 2, workspace, 2
bind = ALT, 3, workspace, 3
bind = ALT, 4, workspace, 4
bind = ALT SHIFT, 1, movetoworkspace, 1
bind = ALT SHIFT, 2, movetoworkspace, 2
bind = ALT SHIFT, 3, movetoworkspace, 3
bind = ALT SHIFT, 4, movetoworkspace, 4
bindm = ALT, mouse:272, movewindow
bindm = ALT, mouse:273, resizewindow

# SUPER kept for bare metal when the host passes the Win key
bind = SUPER, Return, exec, foot
bind = SUPER, D, exec, wofi --show drun
bind = SUPER, Q, killactive,
bind = SUPER, F, fullscreen,
bind = SUPER, M, exit,
bind = SUPER, V, togglefloating,

# LuminOS Glass — VirtualBox-first Hyprland defaults
# Menu: click LuminOS on the bar, or Alt+D
# Terminal: Alt+Return · Files: Alt+E

env = WLR_RENDERER_ALLOW_SOFTWARE,1
env = WLR_NO_HARDWARE_CURSORS,1
env = LIBGL_ALWAYS_SOFTWARE,1
env = AQ_NO_MODIFIERS,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

monitor=,preferred,auto,1

exec-once = /usr/local/bin/lumin-session-init
exec-once = swaybg -i /usr/share/backgrounds/luminos/lumin-wallpaper.jpg -m fill
exec-once = dunst
exec-once = sh -c 'command -v /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 >/dev/null && /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &'
exec-once = waybar
exec-once = /usr/local/bin/lumin-terminal
exec-once = sh -c 'sleep 2 && notify-send -a LuminOS "LuminOS Glass" "Alt+D apps · Alt+Return terminal · Alt+E files · Click LuminOS on the bar"'

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = yes
        tap-to-click = yes
    }
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(e6b800ee) rgba(33ccffee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 4
    blur {
        enabled = false
    }
}

animations {
    enabled = no
}

dwindle {
    preserve_split = yes
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

bind = ALT, Return, exec, /usr/local/bin/lumin-terminal
bind = ALT, D, exec, /usr/local/bin/lumin-menu
bind = ALT, E, exec, /usr/local/bin/lumin-files
bind = ALT, Q, killactive,
bind = ALT, F, fullscreen,
bind = ALT, M, exit,
bind = ALT, V, togglefloating,
bind = ALT, left, movefocus, l
bind = ALT, right, movefocus, r
bind = ALT, up, movefocus, u
bind = ALT, down, movefocus, d
bind = ALT, 1, workspace, 1
bind = ALT, 2, workspace, 2
bind = ALT, 3, workspace, 3
bind = ALT, 4, workspace, 4
bind = ALT SHIFT, 1, movetoworkspace, 1
bind = ALT SHIFT, 2, movetoworkspace, 2
bind = ALT SHIFT, 3, movetoworkspace, 3
bind = ALT SHIFT, 4, movetoworkspace, 4
bindm = ALT, mouse:272, movewindow
bindm = ALT, mouse:273, resizewindow

bind = SUPER, Return, exec, /usr/local/bin/lumin-terminal
bind = SUPER, D, exec, /usr/local/bin/lumin-menu
bind = SUPER, E, exec, /usr/local/bin/lumin-files
bind = SUPER, Q, killactive,
bind = SUPER, F, fullscreen,
bind = SUPER, M, exit,
bind = SUPER, V, togglefloating,

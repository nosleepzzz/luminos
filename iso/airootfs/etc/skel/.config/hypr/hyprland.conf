# LuminOS Glass — default Hyprland session (lean, VM-tolerant)

# Env for VirtualBox / weak GL (also set by lumin-hyprland / start-hyprland)
env = WLR_RENDERER_ALLOW_SOFTWARE,1
env = WLR_NO_HARDWARE_CURSORS,1
env = LIBGL_ALWAYS_SOFTWARE,1
env = AQ_NO_MODIFIERS,1

monitor=,preferred,auto,1

exec-once = waybar
exec-once = dunst
exec-once = swaybg -i /usr/share/backgrounds/luminos/lumin-wallpaper.jpg -m fill
exec-once = sh -c 'command -v /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 >/dev/null && /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &'

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = yes
        tap-to-click = yes
    }
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(e6b800ee) rgba(33ccffee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 4
    blur {
        enabled = false
    }
}

animations {
    enabled = no
}

dwindle {
    # pseudotile removed in Hyprland 0.55+
    preserve_split = yes
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

bind = SUPER, Return, exec, foot
bind = SUPER, D, exec, wofi --show drun
bind = SUPER, Q, killactive,
bind = SUPER, F, fullscreen,
bind = SUPER, M, exit,
bind = SUPER, V, togglefloating,
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

#
# LuminOS Glass — pacman.conf for mkarchiso builds
# Adapted from CachyOS-Live-ISO patterns (GPL-3.0).
# Prefer building on CachyOS so keyrings/mirrors are already present.
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
ILoveCandy
VerbosePkgLists
DisableDownloadTimeout
ParallelDownloads = 10
DisableSandbox
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# CachyOS repos first (kernels, optimized packages)
[cachyos]
Server = https://cdn77.cachyos.org/repo/$arch/$repo
Server = https://us.cachyos.org/repo/$arch/$repo

[core]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch

[extra]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch

[multilib]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch

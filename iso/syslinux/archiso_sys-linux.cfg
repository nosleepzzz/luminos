LABEL luminos_glass
TEXT HELP
Boot LuminOS Glass Edition (Flagship macOS Sonoma Glass Wayland UI).
ENDTEXT
MENU LABEL Boot LuminOS Glass Edition (Flagship ~420MB RAM)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 rd.systemd.show_status=false vt.global_cursor_default=0

